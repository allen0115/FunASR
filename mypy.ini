[mypy]
# Global mypy configuration
ignore_missing_imports = True
# Suppress implicit Optional errors (PEP 484 compatibility)
no_implicit_optional = False

# Suppress "callable is not valid as a type" and other pre-existing type errors
[mypy-funasr.register]
disable_error_code = valid-type, var-annotated, assignment

[mypy-funasr.frontends.wav_frontend]
disable_error_code = assignment, return-value, var-annotated, arg-type, attr-defined
